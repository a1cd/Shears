name: Linux diagnostic (temporary)

# Temporary: runs only a diagnostic test, to find out why two tests miss on CPU.
on:
  push:
    paths:
      - .github/workflows/diag.yml
      - Tests/ShearsTests/ZDiagTests.swift

permissions:
  contents: read

env:
  SPM_CUDA: "0"

jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-linux
      - name: CPU
        run: |
          grep -m1 'model name' /proc/cpuinfo; nproc
          grep -m1 flags /proc/cpuinfo | tr ' ' '\n' | grep -E '^(avx2|avx512f|fma|avx512_bf16)$' | tr '\n' ' '; echo
      - name: diagnostic test
        run: |
          swift package resolve
          swift package edit mlx-swift --path "$HOME/mlx-swift"
          swift test --filter 'MergedExpertTests/testZDiagMergedVsRouted|MergedExpertTests/testPipelineTrainingIsTheSameInMergedAndRoutedLayouts' 2>&1 | grep -E "ZDIAG|Test Case|error:|Executed"
